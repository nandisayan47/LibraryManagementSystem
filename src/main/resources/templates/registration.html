	<form th:action="@{/registration}" method="post"
		style="max-width: 350px; margin: 0 auto;">
		<div class="border border-secondary p-3 rounded">
			<h1>Registration Form</h1>
			
			<div th:if="${param.success}">
					<div class="alert alert-info">You've successfully registered!</div>
				</div>
				
			<div th:if="${param.failure}">
				<div class="alert alert-info">Username already exists.<br>Try a different one.</div>
			</div>
				
			<div class="form-group">
				<label for="username">First Name:</label> 
				<input type="text" class="form-control" placeholder="Enter First Name" id="fname"
					name="fname">
			</div>	
			
			<div class="form-group">
				<label for="username">Last Name:</label> 
				<input type="text" class="form-control" placeholder="Enter Last Name" id="lname"
					name="lname">
			</div>
				
			<div class="form-group">
				<label for="username">City:</label> 
				<input type="text" class="form-control" placeholder="Enter Last Name" id="city"
					name="city">
			</div>
				
			<div class="form-group">
				<label for="username">Username:</label> 
				<input type="text" class="form-control" placeholder="Enter username" id="username"
					name="username">
			</div>
			<div class="form-group">
				<label for="pwd">Password:</label> 
				<input type="password" class="form-control" placeholder="Enter password" id="password"
					name="password">
			</div>
			<div>
			    Already Registered ? <a href="/login"> Login Here </a>
			</div>
			
			
			
			<div class="form-group">
						<button type="submit" class="btn btn-success">Register</button>
			</div>
			
			
			<!--  <button type="submit" class="btn btn-primary">Submit</button>  -->
		</div>
	</form>
</body>
